# Alert rules — Phase 0.
#
# Philosophy: every alert here should be something you would want to be woken
# up for, or at least something you must act on within a day. Alerts that fire
# routinely and get ignored are worse than no alerts, because they teach you to
# ignore the channel that will one day carry the real one.

groups:
  # ==========================================================================
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is not responding"
          description: "Every later phase depends on this. Check: docker compose logs postgres"

  # ==========================================================================
  - name: storage
    rules:
      # Fires early enough that you can act. ZFS performance degrades badly
      # above ~80% capacity because the allocator switches strategies, so 80%
      # is a real operational threshold, not an arbitrary round number.
      - alert: ZFSPoolNearlyFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype="zfs"}
                     / node_filesystem_size_bytes{fstype="zfs"}) > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "ZFS filesystem {{ $labels.mountpoint }} is over 80% full"
          description: "ZFS write performance degrades sharply past 80%. Current usage {{ $value | printf \"%.1f\" }}%. Consider pruning snapshots (zfs list -t snapshot -o name,used -s used) or planning disk replacement."

      - alert: ZFSPoolCriticallyFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype="zfs"}
                     / node_filesystem_size_bytes{fstype="zfs"}) > 92
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ZFS filesystem {{ $labels.mountpoint }} is over 92% full"
          description: "A full copy-on-write filesystem cannot even delete files efficiently. Act now."

      - alert: RootFilesystemFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|zfs"}
                     / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|zfs"}) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem is over 85% full"
          description: "Usually Docker images/logs. Try: docker system prune -a --filter until=168h"

  # ==========================================================================
  - name: disk-health
    rules:
      # SMART is the earliest warning available that a mirror member is failing.
      # Act on it while ZFS still has a healthy second copy to resilver from.
      - alert: SmartDeviceUnhealthy
        expr: smartctl_device_smart_status == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "SMART reports {{ $labels.device }} as FAILING"
          description: "Replace this disk now. Run `zpool status tank` and `smartctl -a {{ $labels.device }}`. Do not wait for it to die."

      # ATA/SATA drives only: NVMe devices do not expose these attributes, so
      # this rule silently matches nothing on an NVMe mirror — NvmeMediaErrors
      # below is the NVMe equivalent. Whichever kind you run, confirm in
      # Prometheus that the relevant series actually exists (checklist step 7);
      # an alert on a metric that never exists looks identical to good health.
      - alert: SmartReallocatedSectorsGrowing
        expr: increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} reallocated new sectors in the last 24h"
          description: "A drive that starts reallocating usually continues. Order a replacement."

      - alert: NvmeMediaErrors
        expr: increase(smartctl_device_media_errors[24h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} logged new NVMe media errors in the last 24h"
          description: "The NVMe analogue of reallocated sectors. Order a replacement."

      - alert: DiskTemperatureHigh
        expr: smartctl_device_temperature{temperature_type="current"} > 55
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} running at {{ $value }}°C"
          description: "Sustained high temperature shortens drive life. Check case airflow."

  # ==========================================================================
  - name: host
    rules:
      - alert: HostOutOfMemory
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 8% memory available"
          description: "On this box the usual suspect is ZFS ARC. Check `arc_summary` and the zfs_arc_max cap in /etc/modprobe.d/zfs.conf."

      - alert: HostHighLoad
        expr: node_load15 / count(count(node_cpu_seconds_total) by (cpu)) > 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "15-minute load average is more than 2x core count"

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "systemd unit {{ $labels.name }} has failed"
          description: "Includes the backup timer. Check: systemctl status {{ $labels.name }}"

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          severity: info
        annotations:
          summary: "Host rebooted recently"
          description: "REMINDER: an encrypted ZFS pool does not auto-unlock. Run `zfs load-key -a && zfs mount -a`, then `cd deploy/compose && docker compose up -d`."

  # ==========================================================================
  - name: backup
    rules:
      # Live age of the last successful backup. Derived here rather than written
      # by the backup script, because a textfile value would freeze at ~0 the
      # moment it was written and never grow.
      #
      # It lives in THIS group, immediately above its consumer, and not with the
      # other recording rules. Prometheus evaluates groups concurrently but the
      # rules WITHIN a group strictly in order, so this placement is the only
      # thing that guarantees BackupTooOld reads an age computed this instant
      # rather than whatever the previous evaluation of some other group left
      # behind. In its own group the two race, and the alert reports an age up
      # to one interval stale — which is how the rule test caught it.
      - record: privatecloud_backup_age_seconds
        expr: time() - privatecloud_backup_last_success_timestamp

      - alert: BackupTimerNotRunning
        expr: node_systemd_unit_state{name="restic-backup.timer",state="active"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "The nightly backup timer is not active"
          description: "No backups are being taken. systemctl status restic-backup.timer"

      # Freshness. restic-backup.sh writes privatecloud_backup_last_success_timestamp
      # to the node_exporter textfile dir after every run; the age is derived
      # live by the recording rule in the 'derived' group below. This is the
      # rule that catches a backup that silently STOPPED, which failure-only
      # ntfy notifications cannot. Threshold: 36h = the 24h RPO + one missed
      # night of grace (RandomizedDelaySec + a retry window). Tune here.
      - alert: BackupTooOld
        expr: privatecloud_backup_age_seconds > 129600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in over 36 hours"
          description: "Last success was {{ $value | humanizeDuration }} ago. The nightly timer or the offsite target is broken. Check: journalctl -u restic-backup.service"

      # A never-succeeded backup (or a textfile collector that isn't wired up)
      # produces no timestamp at all, so BackupTooOld can't fire — absent()
      # covers that blind spot.
      - alert: BackupMetricsMissing
        expr: absent(privatecloud_backup_last_success_timestamp)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Backup freshness metric is absent"
          description: "No backup has ever reported success, or the textfile collector is not wired up. Verify /var/lib/node_exporter/textfile and that restic-backup.sh has run. See docs/custom-metrics.md."

      # The most recent run failed (a failure newer than the last success).
      # ntfy already paged; this is the dashboard-visible corroboration and it
      # keeps firing until a run succeeds, unlike the one-shot push.
      - alert: BackupLastRunFailed
        expr: privatecloud_backup_last_failure_timestamp > privatecloud_backup_last_success_timestamp
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The most recent backup run failed"
          description: "A failure timestamp is newer than the last success. Check: journalctl -u restic-backup.service"

  # ==========================================================================
  - name: zpool-health
    rules:
      # node_exporter's ZFS collector reports ARC/IO but not `zpool status`.
      # These fire on the textfile metrics from scripts/zpool-metrics.sh.
      - alert: ZpoolDegraded
        expr: privatecloud_zpool_health{state="DEGRADED"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is DEGRADED"
          description: "A vdev member has faulted; the pool still serves but has lost redundancy. Run `zpool status {{ $labels.pool }}` and replace the disk — see docs/runbook-restore.md §5."

      - alert: ZpoolUnavailable
        expr: privatecloud_zpool_health{state=~"FAULTED|UNAVAIL|REMOVED|SUSPENDED"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is {{ $labels.state }}"
          description: "The pool is not healthy and data may be inaccessible. Stop-everything event. `zpool status -v {{ $labels.pool }}`; on a single-disk dev pool this means restore from restic (runbook §6)."

      - alert: ZpoolScrubTooOld
        # ~5 weeks. Scrub cadence is monthly (second Sunday), so this allows a
        # missed cycle before paging.
        expr: privatecloud_zpool_scrub_age_seconds > 3024000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool {{ $labels.pool }} has not been scrubbed in over 35 days"
          description: "Scrubs find bit rot while the mirror can still heal it. Check the scrub cron and run `zpool scrub {{ $labels.pool }}`."

      - alert: ZpoolScrubFailed
        expr: privatecloud_zpool_last_scrub_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Last scrub of {{ $labels.pool }} found unrepairable errors"
          description: "`zpool status -v {{ $labels.pool }}` lists the affected files. Restore them from backup — a scrub finding permanent errors means both copies were lost (or, on a single-disk pool, the only copy)."

      - alert: ZpoolMetricsStale
        expr: time() - privatecloud_zpool_metrics_last_update_timestamp > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool health collector has stopped updating"
          description: "privatecloud-zpool-metrics.timer may have failed. Check: systemctl status privatecloud-zpool-metrics.timer"

      - alert: ZpoolMetricsMissing
        expr: absent(privatecloud_zpool_metrics_last_update_timestamp)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool health metrics are absent"
          description: "The zpool textfile collector has never reported. Install privatecloud-zpool-metrics.timer — see docs/custom-metrics.md."

  # ==========================================================================
  - name: api
    rules:
      # The `up` metric for the API job. TargetDown in the availability group
      # already covers scrape failure generically; this one names the service
      # so the notification is actionable without opening Prometheus.
      - alert: ApiDown
        expr: up{job="privatecloud-api"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Private cloud API is not responding to scrapes"
          description: "Check: docker compose logs api --tail 100"

      # Sustained 5xx means the API is broken, not that one request failed.
      # Rate over 10m with a 5% floor avoids paging on a single error during
      # otherwise idle periods, where 1 error in 2 requests would be 50%.
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(privatecloud_http_requests_total{status="5xx"}[10m]))
            / clamp_min(sum(rate(privatecloud_http_requests_total[10m])), 0.01) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Over 5% of API requests are failing with 5xx"
          description: "{{ $value | humanizePercentage }} of requests over the last 10 minutes. Check the API logs for panics."

      # p95 latency on metadata endpoints. File transfer routes will need their
      # own threshold once slice 3 lands — a 2s p95 is fine for a 4GB download
      # and terrible for a directory listing.
      - alert: ApiSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(privatecloud_http_request_duration_seconds_bucket[10m]))
          ) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency on {{ $labels.route }} is above 2s"

      # The pgx pool has a hard ceiling (PC_DB_MAX_CONNS). Sitting near it means
      # requests are queueing for a connection, which shows up to users as
      # everything being slow at once.
      - alert: ApiDatabasePoolSaturated
        expr: privatecloud_db_pool_acquired_connections > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API database connection pool is nearly exhausted"
          description: "{{ $value }} of 10 connections in use. Look for slow queries or a leaked transaction."

  # ==========================================================================
  # Background worker (OCR, extraction, embeddings)
  # ==========================================================================
  - name: jobs
    rules:
      # The worker drains the OCR/embed queue. A queue that stays deep means the
      # worker is stopped or overwhelmed; on this box the usual cause is simply
      # that pcworker is not running. Filenames stay searchable regardless, so this
      # is a warning, not a page.
      - alert: JobQueueBacklog
        expr: privatecloud_jobs{state="queued"} > 500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Background job queue is backed up ({{ $value }} queued)"
          description: "Is pcworker running? Check: docker compose ps pcworker; docker compose logs pcworker --tail 100"

      # Jobs that exhausted their retries and dead-lettered. A steady nonzero count
      # means something is reliably failing — a corrupt file, a sidecar that is
      # down — worth a look rather than silent accumulation.
      - alert: JobsDeadLettering
        expr: privatecloud_jobs{state="failed"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} background jobs have failed permanently"
          description: "Inspect: SELECT kind, last_error, count(*) FROM jobs WHERE state='failed' GROUP BY 1,2;"

  # ==========================================================================
  # Restore drills
  # ==========================================================================
  # A backup nobody has restored is a hypothesis. scripts/restore-drill.sh runs
  # restore-test.sh monthly and writes the outcome here, which turns "we test
  # our backups" from a claim into a series.
  #
  # The important alert of the three is RestoreDrillTooOld, and the reason is
  # worth stating: it fires when the drill has not PASSED recently, which covers
  # the drill failing AND the drill silently not running at all. The second is
  # the likelier failure and the one a pass/fail alert alone would miss
  # entirely.
  - name: restore-drill
    rules:
      # Derived in this group, not the 'derived' one, for the same reason
      # privatecloud_backup_age_seconds is: an alert must read an age computed
      # this instant rather than one left behind by a previous evaluation of
      # another group.
      - record: privatecloud_restore_drill_age_seconds
        expr: time() - privatecloud_restore_drill_last_success_timestamp

      # A quarter, while the timer runs monthly. Three chances to succeed before
      # anything goes red, so the offsite target rebooting during one drill does
      # not page anybody, while a genuinely broken restore path still does.
      - alert: RestoreDrillTooOld
        expr: privatecloud_restore_drill_age_seconds > 7948800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful restore drill in over 92 days"
          description: "Last successful restore was {{ $value | humanizeDuration }} ago — the backups are unverified. Run: sudo ./scripts/restore-drill.sh; check: journalctl -u privatecloud-restore-drill.service"

      - alert: RestoreDrillFailed
        expr: privatecloud_restore_drill_last_run_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The last restore drill failed"
          description: "The backups did not restore. This is the alert that matters most on this server. See /var/log/private-cloud/restore-drill-*.log and docs/runbook-restore.md"

      # Never run at all. Without absent() a server where the drill was never
      # installed looks identical to one where it passes — no series, no alert,
      # no signal. Six weeks, so a freshly built server is not nagged during
      # setup but an abandoned one is.
      - alert: RestoreDrillMetricsMissing
        expr: absent(privatecloud_restore_drill_last_success_timestamp)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "No restore drill has ever reported"
          description: "Either the drill has never run or the textfile collector is not wired up. Install: sudo ./scripts/host-setup.sh --timers"

  # ==========================================================================
  # Recording rules that nothing in this file alerts on live beside the
  # dashboards that read them. A derived series consumed by an alert belongs in
  # the alert's own group instead — see privatecloud_backup_age_seconds in the
  # 'backup' group above for why.
  #
  # (Empty for now. Kept as the documented home for dashboard-only recordings so
  # the next one does not get parked next to an alert that does not need it.)
