# sanoid.conf — snapshot policy for the private-cloud pool.
#
# Installed to /etc/sanoid/sanoid.conf by scripts/sanoid-setup.sh.
# Snapshots are read-only at the filesystem level: no API bug, no compromised
# sync client, and no ransomware running as the app user can alter them. This
# is the primary "oops" and ransomware recovery layer.
#
# Datasets are listed individually (recursive=no) so that tank/staging is
# excluded by simple omission — upload scratch is worthless to snapshot.

[tank/blobs]
        use_template = production

[tank/postgres]
        use_template = production
        # Postgres lives on ZFS, but a filesystem snapshot of a running DB is
        # only crash-consistent. It will recover on start like it would from a
        # power cut. For point-in-time recovery, add pgBackRest WAL archiving
        # (Phase 1). Until then, restic dumps the DB logically — see
        # scripts/restic-backup.sh.

[tank/configs]
        use_template = production

[tank/immich]
        use_template = production

# NOTE: tank/staging is deliberately absent. Do not add it.

#############################################################################
# Templates
#############################################################################

[template_production]
        # Retention ladder from the design doc:
        #   15-minutely x 8   -> 2 hours of fine-grained undo
        #   hourly      x 48  -> 2 days
        #   daily       x 30  -> 1 month
        #   monthly     x 6   -> 6 months
        frequently  = 8
        hourly      = 48
        daily       = 30
        monthly     = 6
        yearly      = 0

        # frequent_period is in minutes; 15 gives the "every 15 min" cadence.
        frequent_period = 15

        autosnap  = yes
        autoprune = yes
