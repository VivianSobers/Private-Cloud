# TLS for the tailnet plane. Imported by the :443 site block in the Caddyfile.
#
# This file is a seam, not a setting: it exists so switching from Caddy's own CA
# to a real certificate is a file swap and a reload rather than an edit to the
# Caddyfile, which is mounted read-only and shared with the public share plane.
#
# ---------------------------------------------------------------------------
# Default: Caddy's internal CA.
#
# Works immediately, needs no network, and every browser warns about it until
# you trust the CA by hand on every device. Fine while you are building; a
# permanent papercut afterwards, and worse than that, it trains you to click
# through certificate warnings on the machine that holds all your files.
tls internal

# ---------------------------------------------------------------------------
# Real certificates, from Tailscale.
#
# Tailscale issues a genuine Let's Encrypt certificate for
# <host>.<tailnet>.ts.net once MagicDNS + HTTPS are enabled in the admin
# console. Nothing is exposed to the internet to get it: the DNS-01 challenge is
# answered by Tailscale's own nameservers, which is precisely why this works for
# a host with no public address.
#
# Run scripts/tailscale-cert.sh on the server. It issues the certificate,
# installs it where Caddy can read it, REWRITES THIS FILE to the two lines
# below, and reloads Caddy. The systemd timer in deploy/systemd/ renews it
# (Tailscale certificates are short-lived, and a certificate nobody renews is a
# scheduled outage).
#
#   tls /etc/caddy/certs/tailnet.crt /etc/caddy/certs/tailnet.key
#
# To go back, put `tls internal` back and reload. The Caddyfile does not change
# either way.
