# pgBackRest configuration — mounted at /etc/pgbackrest/pgbackrest.conf
#
# Point-in-time recovery for the metadata database. The blob store holds the
# file *content*; this holds the tree, the versions, the grants and the shares
# that make those bytes a filesystem rather than a heap. Losing it is not losing
# your files, but it is losing everything that says which file is which.
#
# The repository lives on /tank/postgres/backups, which means restic already
# carries it offsite along with everything else on the pool. That is deliberate:
# a backup repository that only exists on the machine being backed up is a copy,
# not a backup, and the offsite story here is already solved once.

[global]
repo1-path=/var/lib/pgbackrest

# Retention. Two full backups kept, which with the weekly full below means
# roughly two weeks of PITR — long enough to notice "the database has been wrong
# since some point last week", which is the failure this exists for. Differential
# backups in between keep the daily cost small.
repo1-retention-full=2
repo1-retention-diff=6

# Compression. lz4 rather than the default gzip: this box has four cores and one
# spinning disk, so the bottleneck is the disk, and lz4 keeps up with it at a
# fraction of the CPU. zstd would compress better and cost more than the disk
# saves here.
repo1-bundle=y
repo1-block=y
compress-type=lz4
compress-level=1

# One process. Parallelism on a single spindle turns sequential writes into a
# seek storm, and this runs alongside the thing it is protecting.
process-max=1

# Verify what was written. A backup nobody checksums is a backup you find out
# about during a restore.
repo1-retention-archive-type=diff
archive-async=y
spool-path=/var/spool/pgbackrest

# Logging goes to a file rather than stderr so a failing archive_command does not
# flood the Postgres log with the same line once per WAL segment.
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

# Start the database's own checkpoint immediately rather than waiting for the
# next scheduled one. A backup that waits for a checkpoint on an idle server can
# sit there for the whole checkpoint_timeout doing nothing.
start-fast=y

# Stop the backup if the archiver falls behind rather than completing a backup
# whose WAL is incomplete — a backup that cannot replay is worse than a missing
# one, because it looks like protection.
archive-check=y
archive-copy=n

[privatecloud]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/run/postgresql
