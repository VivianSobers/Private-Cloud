# Private cloud — Phase 0 infrastructure stack.
#
#   cd deploy/compose && docker compose up -d
#
# Everything here is infrastructure. No application code runs yet.
#
# SECURITY MODEL (see docs/runbook-disaster-recovery.md for the full threat model):
#   * Three isolated networks. A container can only talk to what it shares a
#     network with. Postgres is on `data` only and is unreachable from the edge.
#   * No published ports on 0.0.0.0. Everything binds to ${TAILSCALE_IP}, so the
#     stack is reachable from your tailnet and invisible to the LAN and internet.
#   * Non-root, read_only rootfs, cap_drop ALL wherever the image tolerates it.
#   * Pinned image tags. See docs/phase-0-checklist.md for pinning to digests,
#     which is what actually makes a build reproducible.
#
# TWO DELIBERATE EXCEPTIONS to full isolation:
#   * cadvisor runs privileged with a read-only docker.sock, because
#     per-container metrics are impossible without it. A read-only docker.sock
#     is still a privilege escalation path (it can read env vars of other
#     containers). Accepted here because cadvisor is a well-known image on a
#     single-operator box; revisit if you ever add untrusted workloads.
#   * smartctl_exporter runs privileged as root, because SMART needs raw
#     device access — and it is the earliest warning a mirror member is dying.

name: privatecloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  # Caddy <-> anything user-facing. The only network with published ports.
  edge:
    driver: bridge
  # Postgres and its clients. internal:true means no route to the internet at
  # all — a compromised exporter cannot phone home from here.
  data:
    driver: bridge
    internal: true
  # Prometheus scrape targets + Grafana.
  monitoring:
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  ntfy_data:          # auth db — the part worth keeping
  ntfy_cache:         # message/attachment cache — expendable
  caddy_data:
  caddy_config:
  web_dist:          # built SPA, produced by the `web` service

services:
  # ==========================================================================
  # Postgres — metadata store for every later phase.
  # ==========================================================================
  postgres:
    image: postgres:17.5-alpine
    container_name: privatecloud-postgres
    <<: *default-restart
    logging: *default-logging
    networks: [data]
    # Bind-mounted onto the ZFS dataset tuned with recordsize=16K.
    # PGDATA points at a subdirectory because Postgres refuses to initialize
    # into a directory that isn't empty, and a ZFS mountpoint root often has
    # a lost+found-alike or the .zfs control dir in the way.
    volumes:
      - /tank/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-privatecloud}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Checksums catch corruption at the DB layer even though ZFS also does.
      # Belt and braces; must be set at initdb time and cannot be added later
      # without a dump/restore.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    user: "999:999"          # postgres user in the alpine image
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /run/postgresql:mode=0700,uid=999,gid=999,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256mb          # too small a /dev/shm breaks parallel query plans
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Memory tuning is per-box and comes from .env. Defaults are the LOW-MEMORY
    # DEV profile (~7GB RAM shared with a desktop + ZFS ARC); the production
    # profile for a 16GB box is documented in deploy/secrets/.env.example.
    # random_page_cost defaults to 4.0 because the dev pool is on a spinning
    # disk; an SSD/ARC-backed production pool wants 1.1.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-4.0}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on

  # ==========================================================================
  # API — the private cloud application (Phase 1).
  # ==========================================================================
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
      args:
        VERSION: ${API_VERSION:-dev}
        COMMIT: ${API_COMMIT:-none}
    image: privatecloud-api:${API_VERSION:-dev}
    container_name: privatecloud-api
    <<: *default-restart
    logging: *default-logging
    # data      -> reach Postgres
    # edge      -> be reached by Caddy
    # monitoring-> be scraped by Prometheus
    networks: [data, edge, monitoring]
    # No ports. The API is reachable only through Caddy, which is itself bound
    # to the Tailscale IP. Publishing a port here would bypass that.
    #
    # File content lives on the ZFS dataset, NOT in a Docker volume. That is
    # what puts it inside sanoid's snapshot schedule and restic's backup set —
    # a named volume under /var/lib/docker would be silently unprotected.
    volumes:
      - ${PC_BLOB_HOST_PATH:-/tank/data/blobs}:/data/blobs
    environment:
      PC_ENV: ${PC_ENV:-prod}
      PC_HTTP_ADDR: ":8080"
      PC_LOG_LEVEL: ${PC_LOG_LEVEL:-info}
      PC_LOG_FORMAT: ${PC_LOG_FORMAT:-json}
      # Assembled from the same credentials Postgres itself uses, so there is
      # one source of truth for the password.
      PC_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-privatecloud}?sslmode=disable"
      PC_MIGRATE_ON_START: "true"
      # Passkeys are bound to this exact domain. Changing it invalidates every
      # enrolled key, so compose fails loudly rather than starting with a
      # placeholder that would silently produce unusable credentials.
      PC_WEBAUTHN_RPID: ${PC_WEBAUTHN_RPID:?set PC_WEBAUTHN_RPID in .env (bare domain, no scheme or port)}
      PC_WEBAUTHN_RP_NAME: ${PC_WEBAUTHN_RP_NAME:-Private Cloud}
      PC_WEBAUTHN_ORIGINS: ${PC_WEBAUTHN_ORIGINS:?set PC_WEBAUTHN_ORIGINS in .env (full origin, with https://)}
      PC_SESSION_TTL: ${PC_SESSION_TTL:-720h}
      PC_COOKIE_NAME: ${PC_COOKIE_NAME:-pc_session}
      PC_COOKIE_SECURE: ${PC_COOKIE_SECURE:-true}
      # --- storage ---
      PC_BLOB_PATH: /data/blobs
      PC_TRASH_RETENTION: ${PC_TRASH_RETENTION:-720h}
      PC_BLOB_GC_INTERVAL: ${PC_BLOB_GC_INTERVAL:-6h}
      PC_UPLOAD_TTL: ${PC_UPLOAD_TTL:-48h}
      # --- semantic search: the API embeds the QUERY through the sidecar. Empty
      #     disables the semantic endpoint; lexical + OCR search are unaffected. ---
      PC_EMBED_URL: ${PC_EMBED_URL:-}
      PC_EMBED_MODEL: ${PC_EMBED_MODEL:-bge-small-en-v1.5}
      PC_EMBED_DIM: ${PC_EMBED_DIM:-384}
      # --- OIDC single sign-on (optional; empty disables it, passkeys unaffected) ---
      PC_OIDC_ISSUER: ${PC_OIDC_ISSUER:-}
      PC_OIDC_CLIENT_ID: ${PC_OIDC_CLIENT_ID:-}
      PC_OIDC_CLIENT_SECRET: ${PC_OIDC_CLIENT_SECRET:-}
      PC_OIDC_REDIRECT_URL: ${PC_OIDC_REDIRECT_URL:-}
      PC_OIDC_ALLOWED_DOMAINS: ${PC_OIDC_ALLOWED_DOMAINS:-}
    # distroless/static:nonroot — uid 65532, no shell, no package manager.
    # read_only applies to the image layers; the blob bind mount above is
    # writable, which is the one place this container needs to write.
    #
    # The host directory must be owned by uid 65532 or the first upload fails
    # with EACCES at startup:
    #   sudo install -d -o 65532 -g 65532 -m 0700 /tank/data/blobs
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      # The image has no shell and no wget, so the binary health-checks itself.
      # This is why cmd/api supports a `healthcheck` subcommand.
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Background worker — OCR, text extraction, tagging, and (optionally) embeds.
  # ==========================================================================
  # A SEPARATE process from the API, so intelligence never shares the API's
  # memory budget. It drains the DB job queue; stop it and every file endpoint
  # still works and search still works on filenames. Its own image carries
  # tesseract for OCR — the API's distroless image cannot.
  pcworker:
    build:
      context: ../../server
      dockerfile: Dockerfile.worker
      args:
        VERSION: ${API_VERSION:-dev}
        COMMIT: ${API_COMMIT:-none}
    image: privatecloud-worker:${API_VERSION:-dev}
    container_name: privatecloud-worker
    <<: *default-restart
    logging: *default-logging
    networks: [data]
    # Reads file content directly from the blob store, READ-ONLY: it only ever
    # reads bytes to extract from, never writes them.
    volumes:
      - ${PC_BLOB_HOST_PATH:-/tank/data/blobs}:/data/blobs:ro
    environment:
      PC_LOG_LEVEL: ${PC_LOG_LEVEL:-info}
      PC_LOG_FORMAT: ${PC_LOG_FORMAT:-json}
      PC_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-privatecloud}?sslmode=disable"
      PC_BLOB_PATH: /data/blobs
      # Point PC_EMBED_URL at the embed-sidecar to have THIS worker embed too;
      # empty (default) is OCR + tagging only. To keep embedding on a separate GPU
      # box instead, leave PC_EMBED_URL empty here, set PC_ENABLE_SEMANTIC=true so
      # extraction still enqueues embed jobs, and run a second pcworker on the GPU
      # box with PC_EMBED_URL set (and no PC_BLOB_PATH) to drain them.
      PC_EMBED_URL: ${PC_EMBED_URL:-}
      PC_ENABLE_SEMANTIC: ${PC_ENABLE_SEMANTIC:-}
      PC_EMBED_MODEL: ${PC_EMBED_MODEL:-bge-small-en-v1.5}
      PC_EMBED_DIM: ${PC_EMBED_DIM:-384}
    # read_only rootfs; tesseract needs a scratch dir, so /tmp is a tmpfs.
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Embedding inference sidecar — semantic search's model tier. GPU-optional.
  # ==========================================================================
  # Behind the `semantic` profile, so it only runs with
  #   docker compose --profile semantic up
  # On a GPU host, add a device reservation (see deploy/embed-sidecar/README.md)
  # and run with the NVIDIA runtime. Then set PC_EMBED_URL in .env to
  #   http://embed-sidecar:8000
  # to activate embedding on both the api and the worker.
  embed-sidecar:
    build:
      context: ../../deploy/embed-sidecar
    image: privatecloud-embed:${API_VERSION:-dev}
    container_name: privatecloud-embed
    profiles: ["semantic"]
    <<: *default-restart
    logging: *default-logging
    networks: [data]
    environment:
      EMBED_MODEL: ${PC_EMBED_HF_MODEL:-BAAI/bge-small-en-v1.5}
    security_opt: [no-new-privileges:true]

  # ==========================================================================
  # Web UI — build-only. Compiles the SPA into the web_dist volume and exits.
  # ==========================================================================
  # Not a long-running service: there is no Node process in production. The
  # container runs once, copies the built bundle into a volume, and stops.
  # `docker compose up` reports it as exited, which is the intended state.
  #
  # Rebuild after changing anything under web/:
  #   docker compose up --build web
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: privatecloud-web:${API_VERSION:-dev}
    container_name: privatecloud-web
    restart: "no"
    logging: *default-logging
    volumes:
      - web_dist:/out
    # Overwrite rather than merge: a stale asset from a previous build left in
    # the volume would be served forever, since nothing else ever removes it.
    command: sh -c "rm -rf /out/* && cp -r /dist/. /out/"

  # ==========================================================================
  # Caddy — TLS termination and the only ingress.
  # ==========================================================================
  caddy:
    image: caddy:2.8.4-alpine
    container_name: privatecloud-caddy
    <<: *default-restart
    logging: *default-logging
    networks: [edge, monitoring]
    # Bound to the Tailscale interface ONLY. If TAILSCALE_IP is unset this
    # fails loudly rather than silently binding 0.0.0.0 and exposing Grafana.
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env — see docs/tailscale-setup.md}:80:80"
      - "${TAILSCALE_IP}:443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # holds issued certs — persist or you re-issue
      - caddy_config:/config
      # The built SPA. Produced by the `web` service below, which is a
      # build-only container: it compiles the bundle into this volume and
      # exits. Caddy serves it; nothing needs a running Node process.
      - web_dist:/srv/web:ro
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cloud}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Hits the /healthz route on the plain-HTTP listener: proves the server
      # is actually serving, not merely that the config parses.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on: [grafana, ntfy, api]

  # ==========================================================================
  # Monitoring
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: privatecloud-prometheus
    <<: *default-restart
    logging: *default-logging
    networks: [monitoring]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days of history at this scrape volume is a few hundred MB.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=8GB
      # POST /-/reload instead of restarting. Unauthenticated, and reachable
      # from the tailnet via Caddy's /prometheus route — acceptable on a
      # single-user tailnet; remove this flag if that ever changes.
      - --web.enable-lifecycle
    user: "65534:65534"                 # nobody
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: privatecloud-alertmanager
    <<: *default-restart
    logging: *default-logging
    # Needs `edge` to reach ntfy for push notifications.
    networks: [monitoring, edge]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # ntfy publish token, referenced by credentials_file in alertmanager.yml.
      # Created as a placeholder in checklist step 5 and filled with a real
      # token in step 8 (it can only be minted once ntfy is running).
      - ../secrets/ntfy-alertmanager.token:/etc/alertmanager/ntfy.token:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    user: "65534:65534"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: privatecloud-grafana
    <<: *default-restart
    logging: *default-logging
    networks: [monitoring]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Grafana sits behind Caddy at /grafana on the tailnet-only plane.
      GF_SERVER_ROOT_URL: https://${TS_HOSTNAME:-cloud}.${TS_TAILNET:-example.ts.net}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    user: "472:472"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # --- exporters ------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: privatecloud-node-exporter
    <<: *default-restart
    logging: *default-logging
    networks: [monitoring]
    # Host namespaces are the point of this exporter: it reports on the host,
    # not on its own container.
    pid: host
    volumes:
      - /:/host:ro,rslave
      # The systemd collector talks to systemd over D-Bus; /host doesn't cover
      # the sockets it dials. Without these two mounts the collector fails
      # silently and node_systemd_unit_state never exists — which would gut
      # the BackupTimerNotRunning alert. Verified in checklist step 7.
      - /run/systemd:/run/systemd:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    command:
      - --path.rootfs=/host
      - --collector.systemd
      - --collector.processes
      # ZFS collector is what surfaces ARC hit rate and pool IO.
      - --collector.zfs
      # Textfile collector: reads *.prom files written by scripts on the host
      # (backup freshness + zpool health). The dir is under the /host bind, so
      # no extra mount is needed — just point at it through /host. The host dir
      # (/var/lib/node_exporter/textfile) must exist before this starts; see
      # docs/custom-metrics.md.
      - --collector.textfile
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile
      - --no-collector.wifi
      - --no-collector.hwmon
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: privatecloud-cadvisor
    <<: *default-restart
    logging: *default-logging
    networks: [monitoring]
    privileged: true          # required to read cgroup + container stats
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # DOCUMENTED EXCEPTION: read-only docker.sock. See header comment.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false

  smartctl_exporter:
    image: prometheuscommunity/smartctl-exporter:v0.13.0
    container_name: privatecloud-smartctl-exporter
    <<: *default-restart
    logging: *default-logging
    networks: [monitoring]
    # SMART requires raw device access. This is the earliest warning you get
    # that a mirror member is dying — worth the privilege.
    privileged: true
    user: root
    volumes:
      - /dev:/dev:ro
    security_opt: [no-new-privileges:true]

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: privatecloud-postgres-exporter
    <<: *default-restart
    logging: *default-logging
    # Straddles both: reaches Postgres on `data`, scraped from `monitoring`.
    networks: [data, monitoring]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-privatecloud}?sslmode=disable"
    user: "65534:65534"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # ntfy — push alerts to your phone.
  # ==========================================================================
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: privatecloud-ntfy
    <<: *default-restart
    logging: *default-logging
    networks: [edge]
    # Published directly on the Tailscale IP (in addition to the Caddy route)
    # so that restic-backup.sh — which runs on the HOST, outside Docker's
    # networks — can deliver failure notifications without fighting Caddy's
    # internal-CA TLS. Still tailnet-only, still deny-all auth.
    ports:
      - "${TAILSCALE_IP}:8080:8080"
    command: serve
    environment:
      NTFY_BASE_URL: https://${TS_HOSTNAME:-cloud}.${TS_TAILNET:-example.ts.net}/ntfy
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: "72h"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # deny-all: only authenticated clients may publish or subscribe. Without
      # this, anyone who reaches the service can read your alert topics.
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
