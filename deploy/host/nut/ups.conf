# NUT driver configuration — /etc/nut/ups.conf
#
# One UPS, connected by USB. `usbhid-ups` drives essentially every consumer UPS
# worth buying (APC Back-UPS, CyberPower, Eaton Ellipse); run `nut-scanner -U`
# on the server to confirm the driver and to fill in vendorid/productid if you
# have more than one USB device that presents as a UPS.
#
# Why a UPS is on this list at all: ZFS survives a power cut by design, and the
# design assumes the pool is *told* about it. What it does not survive well is
# the second and third power cut during the resilver after the first. The point
# of a UPS here is not uptime — it is a clean shutdown, every time.

[ups]
    driver = usbhid-ups
    port = auto
    desc = "private-cloud UPS"

    # Poll often enough that we notice the line failing within a couple of
    # seconds. The default (2s) is fine; stated explicitly because the whole
    # value of this file is the shutdown happening before the battery is flat.
    pollinterval = 2

    # Some consumer units report a wildly optimistic runtime. If yours does,
    # override the low-battery threshold rather than trusting it:
    # override.battery.charge.low = 40
