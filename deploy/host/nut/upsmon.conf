# NUT monitor configuration — /etc/nut/upsmon.conf
#
# This is the file that actually shuts the machine down. Everything else in NUT
# exists to get a truthful battery reading to this process.
#
# The password below is a placeholder: scripts/host-setup.sh replaces it with a
# generated one and writes the matching entry into upsd.users, which is why
# neither file contains a real secret in git.

MONITOR ups@localhost 1 upsmon UPSMON_PASSWORD_PLACEHOLDER primary

MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15

POWERDOWNFLAG /etc/killpower

# Notifications. NOTIFYFLAG ... SYSLOG+EXEC sends each event to the handler
# below as well as to syslog, so a power event reaches your phone through the
# same ntfy topic every other alert uses. A UPS that quietly ran out of battery
# at 3am is indistinguishable from a power cut you were never told about.
NOTIFYCMD /usr/local/sbin/privatecloud-ups-notify
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC

# Deliberately NOT set: FINALDELAY beyond the default. The temptation is to buy
# a few more minutes on battery by delaying the shutdown, which spends exactly
# the margin that makes the shutdown clean. The pool is what matters, not the
# last ninety seconds of uptime.
